name: Apex Wealth Lab Autopilot Engine

on:
  schedule:
    # Runs 3x daily at high-retention US Finance windows:
    # 1. 11:30 UTC -> 7:30 AM EST
    # 2. 16:30 UTC -> 12:30 PM EST
    # 3. 21:30 UTC -> 5:30 PM EST
    - cron: '30 11,16,21 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies for Video Editing
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai requests moviepy==1.0.3 imageio-ffmpeg google-api-python-client google-auth-oauthlib google-auth-httplib2 edge-tts "Pillow<10.0.0" opencv-python


      - name: Run Autopilot Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          echo "=== BYPASSING INVISIBLE CHARACTERS ==="
          REAL_FILE=$(ls | grep -E 'main.*py' | head -n 1)
          echo "Successfully targeted raw filename: '$REAL_FILE'"
          python "$REAL_FILE"
